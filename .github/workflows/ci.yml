name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check Bash syntax
        run: bash -n run.sh tests/test_transform.sh
      - name: Run transformation tests
        run: bash tests/test_transform.sh
      - name: Run ShellCheck
        run: shellcheck --severity=warning run.sh tests/test_transform.sh
